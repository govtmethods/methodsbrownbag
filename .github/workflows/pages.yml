name: Deploy book with GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Monthly canary. A green checkmark only ever describes the last run, so
  # dependency rot (an evicted package cache, a new system library) stays
  # invisible until someone pushes. This surfaces it on a schedule instead.
  #
  # A scheduled run deploys as well as builds -- deliberately. The point is to
  # exercise the real publish path, not a subset of it; republishing identical
  # output is harmless. See DECISIONS.md.
  #
  # GitHub suspends scheduled workflows after 60 days with no commits and mails
  # the owner. Expect that during a quiet stretch; any push resets the clock.
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Scoped by ref: without this a pull-request build shares the "pages" group
  # with main and can cancel a deploy already in flight.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"

      - name: Install system dependencies and TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libuv1-dev \
            libglpk-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libwebp-dev \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-luatex \
            texlive-xetex \
            lmodern \
            latexmk

      - name: Restore R packages (renv)
        uses: r-lib/actions/setup-renv@v2

      - name: Render
        run: quarto render --no-clean

      - name: Copy PDF into _book
        run: |
          mkdir -p _book
          if [ -f "_book/Methods-Brown-Bag.pdf" ]; then
            echo "PDF already present in _book"
          elif [ -f "Methods-Brown-Bag.pdf" ]; then
            cp "Methods-Brown-Bag.pdf" "_book/Methods-Brown-Bag.pdf"
          else
            echo "PDF not found after render"
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    # Pull requests get the build as a status check, but never publish.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4